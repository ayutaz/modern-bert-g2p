pilot: P-B
model:
  encoder_name: sbintuitions/modernbert-ja-130m
  head_variant: B1
  max_mora_per_morph: 8
  phoneme_vocab_size: 68
  apbp_alpha: 0.2
  label_smoothing: 0.05
  dict_hit_weight: 0.3
  lstm_hidden: 256
data:
  train_path: data/processed/v1/train.parquet
  val_path: data/processed/v1/val.parquet
  test_path: data/processed/v1/test.parquet
  hard_set_path: data/hard_set_seed/samples.jsonl
  jsut_yaml: jsut-label/text_kana/basic5000.yaml
  jvs_dir: data/eval/jvs_kana
  rohan_txt: data/eval/rohan/rohan4600.txt
  batch_size: 8
  num_workers: 0
training:
  encoder_lr: 5.0e-5
  head_lr: 3.0e-4
  warmup_steps: 1500
  total_steps: 45000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  seed: 20260704
  accumulate_grad_batches: 64
output_dir: reports/phase2/p_b/{seed}
