pilot: P-A
model:
  encoder_name: /root/models/modernbert_a
  decoder_layers: 6
  decoder_hidden: 512
  decoder_heads: 8
  decoder_ffn: 2048
  decoder_dropout: 0.1
  phoneme_vocab_size: 68
  label_smoothing: 0.1
  beam_size: 4
  length_penalty: 1.0
  coverage_penalty: 0.2
data:
  train_path: data/processed/v1_5src/train.parquet
  val_path: data/processed/v1_5src/val.parquet
  test_path: data/processed/v1_5src/test.parquet
  hard_set_path: data/hard_set_seed/samples.jsonl
  jsut_yaml: data/eval/jsut-label/text_kana/basic5000.yaml
  jvs_dir: data/eval/jvs_nonpara_kana
  rohan_txt: data/eval/haqumei_repo/resources/Rohan4600_transcript_utf8.txt
  batch_size: 32
  num_workers: 4
training:
  encoder_lr: 5.0e-5
  head_lr: 3.0e-4
  warmup_steps: 1500
  total_steps: 30000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  seed: 20260704
  accumulate_grad_batches: 4
output_dir: reports/phase2/p_a_30k/{seed}
