pilot: P-C
model:
  encoder_name: tohoku-nlp/bert-base-japanese-char-v2
  head_variant: C1
  max_slot: 8
  phoneme_vocab_size: 68
  apbp_alpha: 0.2
  label_smoothing: 0.05
data:
  train_path: data/processed/v1/train.parquet
  val_path: data/processed/v1/val.parquet
  test_path: data/processed/v1/test.parquet
  hard_set_path: data/hard_set_seed/samples.jsonl
  jsut_yaml: data/eval/jsut-label/text_kana/basic5000.yaml
  jvs_dir: data/eval/jvs_nonpara_kana
  rohan_txt: data/eval/haqumei_repo/resources/Rohan4600_transcript_utf8.txt
  batch_size: 2
  num_workers: 0
training:
  encoder_lr: 5.0e-5
  head_lr: 5.0e-5
  warmup_steps: 50
  total_steps: 200
  weight_decay: 0.01
  grad_clip: 1.0
  precision: fp32
  seed: 20260704
  accumulate_grad_batches: 1
output_dir: reports/phase2/p_c_cpu/{seed}
