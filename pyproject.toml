[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modernbert-g2p"
version = "0.1.0-alpha.0"
description = "ModernBERT-based Japanese Grapheme-to-Phoneme model."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "modern-bert-g2p contributors" },
]
keywords = ["g2p", "japanese", "modernbert", "phoneme", "tts"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Phase 0 の modernbert_g2p パッケージ本体は metrics のみで、外部モデル依存ゼロ。
# haqumei / pyopenjtalk-plus / jiwer は scripts/eval_*.py が使うので
# `baselines` optional extra に切り出し、unit CI を軽量に保つ。
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Baseline re-production of Phase 0 targets. CLAUDE.md §"設計の核心思想 5"
# mandates pyopenjtalk-plus (~800K-entry dict). The reported haqumei PER 1.17%
# baseline is measured with the plus fork — bare pyopenjtalk is *not*
# equivalent (F3 in Phase 0 finish critique).
baselines = [
    "haqumei==0.8.0",
    "pyopenjtalk-plus",
    "jiwer>=3",
    "tqdm>=4.66",
]
training = [
    "torch>=2.13.0",
    "transformers>=4.48",
    "wandb",
    "omegaconf",
    "fugashi[unidic]",
]
# Phase 2 MeCab pretokenizer requires fugashi + unidic-lite. Kept out of
# the base install so unit CI (metrics + data pipeline) does not require
# a MeCab toolchain.
phase2 = [
    "fugashi>=1.3",
    "unidic-lite>=1.0",
]
# Phase 1 data pipeline output writers and Wikipedia HTML parsing.
# `pyarrow` is required for Parquet output (JSONL fallback works without it);
# `lxml` is used by the Wikipedia ingest source when available.
pipeline = [
    "pyarrow>=15",
    "lxml>=5",
]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/yousan/modern-bert-g2p"
Repository = "https://github.com/yousan/modern-bert-g2p"
Documentation = "https://github.com/yousan/modern-bert-g2p/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/modernbert_g2p"]

[tool.hatch.build.targets.sdist]
include = [
    "src/modernbert_g2p",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Baseline eval scripts follow haqumei-eval / Levenshtein SDI convention:
# S_total / D_total / I_total / N_total mirror the mathematical variables
# in the PER definition (Substitutions / Deletions / Insertions / N=reference
# length). Renaming them would divorce the code from the metric spec.
"scripts/eval_haqumei_jsut.py" = ["N806"]
# tests exercise the 'N' JULIUS phoneme (moraic n); the test-function name
# preserves the exact symbol under test.
"tests/test_metrics.py" = ["N802"]
# Phase 1 data pipeline tests preserve exact JULIUS phoneme / accent-pattern
# symbols (L, H, aType, all_L, ...) in test function names, alias schema
# classes (Row) into local variables for fixture readability, and compare
# module-level frozensets on the LHS of asserts to mirror the definition.
"tests/data/*" = ["N802", "N806", "SIM300"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
